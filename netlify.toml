# ============================================================
# netlify.toml — deploy automático a partir do Git.
#
# O config.js não vai para o repositório: é gerado na hora do build a
# partir das variáveis de ambiente do site no Netlify
#   Site configuration → Environment variables:
#     SUPABASE_URL       = https://xxxx.supabase.co
#     SUPABASE_ANON_KEY  = a anon key
# Se alguma faltar, o build FALHA de propósito — um site publicado sem
# elas abre em "modo local" e engana todo mundo.
# ============================================================
[build]
  publish = "."
  command = "bash gerar-config.sh"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
